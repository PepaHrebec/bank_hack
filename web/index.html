<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone</title>
  <link rel="stylesheet" href="/static/phone.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="phone">
    <div class="screen" id="screen">
      <div class="statusbar">
        <span class="clock"></span>
        <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
      </div>

      <!-- Home screen. Only the George icon does anything; the rest are filler. -->
      <div class="home" id="home">
        <div class="widget"></div>
        <div class="icon-grid">
          <button class="icon" type="button"><img src="/static/icons/tinder.png" alt=""><span>Tinder</span></button>
          <button class="icon" type="button"><img src="/static/icons/youtube.png" alt=""><span>YouTube</span></button>
          <button class="icon" type="button"><img src="/static/icons/grindr.png" alt=""><span>Grindr</span></button>
          <button class="icon" type="button" id="appIcon"><img src="/static/icons/george.png" alt=""><span>George</span></button>
        </div>
        <div class="dock">
          <button class="icon" type="button"><img src="/static/icons/safari.png" alt="Safari"></button>
          <button class="icon" type="button"><img src="/static/icons/whatsapp.png" alt="WhatsApp"></button>
          <button class="icon" type="button"><img src="/static/icons/spotify.png" alt="Spotify"></button>
          <button class="icon" type="button"><img src="/static/icons/instagram.png" alt="Instagram"></button>
        </div>
      </div>

      <main id="app"></main>

      <div class="banner-layer" id="banners"></div>

      <div class="shade" id="shade">
        <div class="shade-top">
          <span class="shade-time clock"></span>
          <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="shade-list" id="shadeList"></div>
        <div class="shade-grab"></div>
      </div>

      <div class="pull-zone" id="pullZone"></div>
      <div class="swipe-zone" id="swipeZone"></div>
      <div class="island"></div>
      <div class="homebar"></div>
    </div>
  </div>

  <script src="/static/phone.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
