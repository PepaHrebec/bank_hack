<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone</title>
  <link rel="stylesheet" href="/static/phone.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/fillers.css">
  <link rel="stylesheet" href="/static/whatsapp.css">
  <link rel="stylesheet" href="/static/surfers.css">
</head>
<body>
  <div class="phone">
    <div class="screen" id="screen">
      <div class="statusbar">
        <span class="clock"></span>
        <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
      </div>

      <!-- Home screen. Geoff opens our app; Spotify opens a filler mock-up. -->
      <div class="home" id="home">
        <div class="widget" id="widget" data-opens="app"></div>
        <div class="icon-grid">
          <button class="icon" type="button"><img src="/static/icons/youtube.png" alt=""><span>YouTube</span></button>
          <button class="icon" type="button" data-opens="app"><img src="/static/icons/geoff.svg" alt=""><span>Geoff</span></button>
          <button class="icon" type="button" data-opens="surfers"><img src="/static/icons/surfers.svg" alt=""><span>Surfers</span></button>
        </div>
        <div class="dock">
          <button class="icon" type="button"><img src="/static/icons/safari.png" alt="Safari"></button>
          <button class="icon" type="button" data-opens="whatsapp"><img src="/static/icons/whatsapp.png" alt="WhatsApp"></button>
          <button class="icon" type="button" data-opens="spotify"><img src="/static/icons/spotify.png" alt="Spotify"></button>
          <button class="icon" type="button"><img src="/static/icons/instagram.png" alt="Instagram"></button>
        </div>
      </div>

      <main id="app" class="app-window open"></main>
      <section id="spotify" class="app-window filler-app" data-statusbar="light"></section>

      <section id="whatsapp" class="app-window" data-statusbar="light"></section>
      <section id="surfers" class="app-window" data-statusbar="light"></section>

      <div class="banner-layer" id="banners"></div>

      <div class="shade" id="shade">
        <div class="shade-top">
          <span class="shade-time clock"></span>
          <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <button type="button" class="shade-clear" id="shadeClear" hidden>Smazat vše</button>
        <div class="shade-list" id="shadeList"></div>
        <div class="shade-grab"></div>
      </div>

      <div class="pull-zone" id="pullZone"></div>
      <div class="swipe-zone" id="swipeZone"></div>
      <div class="island"></div>
      <div class="homebar"></div>
    </div>
  </div>

  <aside class="demo-pay" id="demoAside">
    <button type="button" class="demo-chip" id="demoChip" aria-label="Platba kartou (demo)">&#x1F4B3;</button>
    <div class="demo-panel">
      <h4>Platba kartou (demo)<button type="button" class="demo-close" id="demoClose" aria-label="Zavřít">&#x2715;</button></h4>
      <form id="demoPay">
        <input id="demoAmount" type="number" min="1" step="1" placeholder="Částka (Kč)">
        <input id="demoNote" type="text" maxlength="60" placeholder="Poznámka">
        <button type="submit">Zaplatit</button>
      </form>
      <div class="demo-msg" id="demoMsg"></div>
    </div>
  </aside>

  <script src="/static/phone.js"></script>
  <script src="/static/fillers.js"></script>
  <script src="/static/whatsapp.js"></script>
  <script src="/static/surfers.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
